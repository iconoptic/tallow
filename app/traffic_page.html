<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic</title>
<link rel="stylesheet" href="/panel.css">
<link rel="stylesheet" href="/vendor/vis-timeline.css">
<style>
  .bar { align-items: center; }
  .check { display: flex; align-items: center; gap: 0.45rem; color: var(--note); margin: 0; }
  #map { width: 100%; height: auto; margin-top: 1rem; background: #1c1914; border-radius: var(--radius); touch-action: none; }
  #map text { fill: var(--text); font-size: 14px; font-family: system-ui, sans-serif; }
  #lanes { margin-top: 1rem; min-height: 12rem; }
  .vis-timeline { border-color: var(--edge); background: var(--chip); color: var(--text); }
  .vis-time-axis .vis-text { color: var(--note); }
  .vis-grid.vis-minor, .vis-grid.vis-major { border-color: var(--edge); }
  .vis-item { color: #1c160f; border-color: transparent; }
  .vis-labelset .vis-label { color: var(--text); border-color: var(--edge); }
  .vis-foreground .vis-group { border-color: var(--edge); }
</style>
</head>
<body>
<main class="wide">
  <a class="back" href="/">&larr; tallow</a>
  <h1>Traffic</h1>
  <p class="note">Every address the mesh hears. Drag a node to place it. A dot sits between the listeners that hear it. A pass-by is one stay, then silence.</p>
  <p id="error" class="err" role="status"></p>
  <div class="bar">
    <button type="button" id="win-live">Live</button>
    <button type="button" id="win-hour">Hour</button>
    <button type="button" id="win-day">Day</button>
    <label class="check"><input type="checkbox" id="passes"> Show one-ping addresses</label>
    <button type="button" id="clear" class="quiet">Clear log</button>
  </div>
  <p id="summary" class="note"></p>
  <svg id="map" viewBox="0 0 1000 640" role="img" aria-label="Nodes and where addresses were heard"></svg>
  <p id="band" class="note"></p>
  <div id="lanes"></div>
  <p id="empty" class="note" hidden>Nothing heard in this window.</p>
</main>
<script src="/vendor/vis-timeline.js"></script>
<script>
const REFRESH_MS = 5000;
const PALETTE = ["#e7d7b1", "#8fb9a8", "#d4a574", "#c9857a", "#9bb4d4", "#c7b3e0", "#e0d38a", "#7fbfb0"];
const SVG = "http://www.w3.org/2000/svg";
const errorEl = document.getElementById("error");
const summaryEl = document.getElementById("summary");
const mapEl = document.getElementById("map");
const bandEl = document.getElementById("band");
const lanesEl = document.getElementById("lanes");
const emptyEl = document.getElementById("empty");
const passesEl = document.getElementById("passes");
const colors = {};
let colorNext = 0;
let payload = null;
let windowName = "live";
let scrub = null;
let following = true;
let places = {};
let anchors = {};
let lastFix = {};
let drag = null;
let dragAt = null;
let timeline = null;
let itemSet = null;
let groupSet = null;

function svg(tag) {
  return document.createElementNS(SVG, tag);
}

function clamp(value) {
  if (value < 0) return 0;
  if (value > 1) return 1;
  return value;
}

function colorFor(id) {
  if (!colors[id]) {
    colors[id] = PALETTE[colorNext % PALETTE.length];
    colorNext += 1;
  }
  return colors[id];
}

function escapeText(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function shownTracks() {
  const tracks = payload && payload.tracks || [];
  if (passesEl.checked) return tracks;
  return tracks.filter((track) => track.class !== "pass" || track.named);
}

function bandTracks() {
  if (passesEl.checked) return [];
  const tracks = payload && payload.tracks || [];
  return tracks.filter((track) => track.class === "pass" && !track.named);
}

function stayAt(track, time) {
  let found = null;
  (track.stays || []).forEach((stay) => {
    if (time + 15000 >= stay.start && time <= stay.end + 45000) found = stay;
  });
  return found;
}

function ensureAnchors(nodes) {
  nodes.forEach((node, index) => {
    if (anchors[node.id]) return;
    if (typeof node.x === "number" && typeof node.y === "number") {
      anchors[node.id] = { x: node.x, y: node.y };
      return;
    }
    const angle = -Math.PI / 2 + (index / Math.max(nodes.length, 1)) * Math.PI * 2;
    anchors[node.id] = { x: clamp(0.5 + Math.cos(angle) * 0.34), y: clamp(0.5 + Math.sin(angle) * 0.34) };
  });
}

const FRESH_MS = 60000;
const WARM_MS = 20000;
const THIN_AREA = 0.01;
const OUTLIER_DB = 8;
const LN10 = Math.LN10;

// Same rule as the firmware: odd count takes the middle, even count averages the
// two central samples and truncates toward zero.
function medianRssi(values) {
  const sorted = values.slice().sort((a, b) => a - b);
  const count = sorted.length;
  if (count % 2 === 1) return sorted[(count - 1) / 2];
  return Math.trunc((sorted[count / 2 - 1] + sorted[count / 2]) / 2);
}

function readingsAt(track, time) {
  const by = {};
  (track.samples || []).forEach((sample) => {
    if (typeof sample.t !== "number" || typeof sample.rssi !== "number" || !sample.node) return;
    if (sample.t > time || time - sample.t > FRESH_MS) return;
    if (sample.rssi <= -100 || sample.rssi === -127) return;
    if (!by[sample.node]) by[sample.node] = [];
    by[sample.node].push(sample);
  });
  const list = Object.keys(by).map((id) => {
    const recent = by[id].sort((a, b) => a.t - b.t).slice(-3);
    return { id: id, rssi: medianRssi(recent.map((sample) => sample.rssi)) };
  });
  if (list.length) return list;
  const stay = stayAt(track, time);
  if (!stay || typeof stay.rssi !== "number" || stay.rssi <= -100 || stay.rssi === -127) return [];
  return [{ id: stay.node, rssi: stay.rssi }];
}

// Places are 0..1 on a 1000×640 canvas. Distance uses that proportion, then comes back.
const CANVAS_Y = 640 / 1000;

function proportion(point) {
  return { x: point.x, y: point.y * CANVAS_Y, rssi: point.rssi };
}

function storedPoint(point) {
  return { x: point.x, y: point.y / CANVAS_Y };
}

// rssi = tx - 10*n*log10(distance). Two links of our own nodes fit n; otherwise the house is 2.7.
function exponent(nodes) {
  const rows = [];
  (nodes || []).forEach((node) => {
    if (!node.parent || typeof node.parent_rssi !== "number") return;
    const rssi = node.parent_rssi;
    if (rssi < -95 || rssi > -20) return;
    const child = places[node.id];
    const parent = places[node.parent];
    if (!child || !parent) return;
    const from = proportion(child);
    const to = proportion(parent);
    const distance = Math.hypot(from.x - to.x, from.y - to.y);
    if (distance < 0.02) return;
    rows.push({ rssi: rssi, logd: Math.log10(distance) });
  });
  if (rows.length < 2) return 2.7;
  let count = rows.length;
  let sx = 0;
  let sy = 0;
  let sxx = 0;
  let sxy = 0;
  rows.forEach((row) => {
    sx += row.logd;
    sy += row.rssi;
    sxx += row.logd * row.logd;
    sxy += row.logd * row.rssi;
  });
  const den = count * sxx - sx * sx;
  if (den === 0) return 2.7;
  const slope = (count * sxy - sx * sy) / den;
  let n = -slope / 10;
  if (!isFinite(n)) return 2.7;
  if (n < 1.5) return 1.5;
  if (n > 4.5) return 4.5;
  return n;
}

function section(p1, p2, n) {
  const a = proportion(p1);
  const b = proportion(p2);
  const ratio = Math.pow(10, (p2.rssi - p1.rssi) / (10 * n));
  if (!isFinite(ratio)) return storedPoint({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const denom = 1 + ratio;
  return storedPoint({ x: (a.x + ratio * b.x) / denom, y: (a.y + ratio * b.y) / denom });
}

function solve2(a00, a01, a11, b0, b1) {
  const det = a00 * a11 - a01 * a01;
  if (Math.abs(det) < 1e-12) return null;
  return [(b0 * a11 - a01 * b1) / det, (a00 * b1 - a01 * b0) / det];
}

function triangleArea(a, b, c) {
  const p = proportion(a);
  const q = proportion(b);
  const r = proportion(c);
  return Math.abs(p.x * (q.y - r.y) + q.x * (r.y - p.y) + r.x * (p.y - q.y)) / 2;
}

function thin(loud) {
  return loud.length < 3 || triangleArea(loud[0], loud[1], loud[2]) < THIN_AREA;
}

function distanceAt(at, node) {
  const point = proportion(node);
  const dist = Math.hypot(at.x - point.x, at.y - point.y);
  return dist < 0.02 ? 0.02 : dist;
}

// How far each reading sits from one transmit level. The level is the median
// implied by the readings, so one wild RSSI is the one that stands out.
function worstOff(readings, spot, n) {
  const at = proportion(spot);
  const rows = readings.map((node) => {
    const dist = distanceAt(at, node);
    return { node: node, tx: node.rssi + 10 * n * Math.log10(dist) };
  });
  const levels = rows.map((row) => row.tx).sort((a, b) => a - b);
  const mid = levels.length % 2 === 1
    ? levels[(levels.length - 1) / 2]
    : (levels[levels.length / 2 - 1] + levels[levels.length / 2]) / 2;
  let worst = null;
  rows.forEach((row) => {
    const db = Math.abs(row.tx - mid);
    if (!worst || db > worst.db) worst = { node: row.node, db: db };
  });
  return worst;
}

function solvePlane(readings, n, startStored) {
  const scaled = readings.map(proportion);
  let loudIndex = 0;
  scaled.forEach((node, index) => {
    if (node.rssi > scaled[loudIndex].rssi) loudIndex = index;
  });
  const loud = scaled[loudIndex];
  let x;
  let y;
  if (startStored && isFinite(startStored.x) && isFinite(startStored.y)) {
    const warm = proportion(startStored);
    x = warm.x;
    y = warm.y;
  } else {
    const ordered = readings.slice().sort((a, b) => b.rssi - a.rssi);
    const start = proportion(section(ordered[0], ordered[1], n));
    x = start.x;
    y = start.y;
  }
  for (let iter = 0; iter < 8; iter++) {
    let loudDx = x - loud.x;
    let loudDy = y - loud.y;
    let dLoud = Math.hypot(loudDx, loudDy);
    if (dLoud < 0.02) dLoud = 0.02;
    let a00 = 0;
    let a01 = 0;
    let a11 = 0;
    let b0 = 0;
    let b1 = 0;
    for (let index = 0; index < scaled.length; index++) {
      if (index === loudIndex) continue;
      const node = scaled[index];
      let dx = x - node.x;
      let dy = y - node.y;
      let dist = Math.hypot(dx, dy);
      if (dist < 0.02) dist = 0.02;
      // r = (rssi - rssi_loud) + 10·n·log10(d / d_loud). Transmit power cancels.
      const residual = (node.rssi - loud.rssi) + 10 * n * Math.log10(dist / dLoud);
      const scale = (10 * n) / LN10;
      const jx = scale * (dx / (dist * dist) - loudDx / (dLoud * dLoud));
      const jy = scale * (dy / (dist * dist) - loudDy / (dLoud * dLoud));
      a00 += jx * jx;
      a01 += jx * jy;
      a11 += jy * jy;
      // J is ∂r/∂(x, y), so JᵀJ·δ = −Jᵀr.
      b0 -= jx * residual;
      b1 -= jy * residual;
    }
    const delta = solve2(a00, a01, a11, b0, b1);
    if (!delta) return null;
    let stepX = delta[0];
    let stepY = delta[1];
    const step = Math.hypot(stepX, stepY);
    if (step > 0.5) {
      stepX *= 0.5 / step;
      stepY *= 0.5 / step;
    }
    x += stepX;
    y += stepY;
    if (!isFinite(x) || !isFinite(y)) return null;
  }
  const back = storedPoint({ x: x, y: y });
  if (back.x < -0.25 || back.x > 1.25 || back.y < -0.25 || back.y > 1.25) return null;
  return back;
}

function lone(at, index) {
  const angle = (index % 8) * 0.8;
  return { x: at.x + Math.cos(angle) * 36, y: at.y + Math.sin(angle) * 36 };
}

function placeTrack(track, pos, n, index) {
  const known = readingsAt(track, scrub).filter((reading) => pos[reading.id] && places[reading.id]);
  if (!known.length) return null;
  if (known.length === 1) return lone(pos[known[0].id], index);
  const layout = known.map((reading) => ({
    x: places[reading.id].x,
    y: places[reading.id].y,
    rssi: reading.rssi,
  }));
  const loud = layout.slice().sort((a, b) => b.rssi - a.rssi);
  let spot;
  if (layout.length === 2 || thin(loud)) {
    spot = section(loud[0], loud[1], n);
  } else {
    const prior = track.id && lastFix[track.id];
    const warm = prior && Math.abs(scrub - prior.t) < WARM_MS ? prior : null;
    const solved = solvePlane(layout, n, warm);
    spot = solved || section(loud[0], loud[1], n);
    // A bad reading pulls the fix, and at that pulled spot the honest node is
    // the one that looks wrong. Try each listener left out, and keep the set
    // whose own fix agrees within OUTLIER_DB.
    if (solved && layout.length >= 4 && worstOff(layout, solved, n).db > OUTLIER_DB) {
      let best = null;
      layout.forEach((candidate) => {
        const rest = layout.filter((node) => node !== candidate);
        const restLoud = rest.slice().sort((a, b) => b.rssi - a.rssi);
        if (rest.length < 3 || thin(restLoud)) return;
        const again = solvePlane(rest, n, null);
        if (!again) return;
        const spread = worstOff(rest, again, n).db;
        if (!best || spread < best.spread) best = { spot: again, spread: spread };
      });
      if (best && best.spread <= OUTLIER_DB) spot = best.spot;
    }
  }
  if (track.id) lastFix[track.id] = { x: spot.x, y: spot.y, t: scrub };
  return { x: spot.x * 1000, y: spot.y * 640 };
}

function rawDistance(a, b) {
  const from = proportion(a);
  const to = proportion(b);
  return Math.hypot(from.x - to.x, from.y - to.y);
}

function rangeEdges(ranges) {
  const byKey = {};
  (ranges || []).forEach((range) => {
    if (!range || typeof range.rssi !== "number" || !isFinite(range.rssi)) return;
    const left = range.a;
    const right = range.b;
    if (!left || !right || left === right || !anchors[left] || !anchors[right]) return;
    const a = left < right ? left : right;
    const b = left < right ? right : left;
    const key = a + "\0" + b;
    if (!byKey[key]) byKey[key] = { a: a, b: b, rssi: range.rssi };
  });
  return Object.keys(byKey).map((key) => byKey[key]);
}

function rangeComponents(edges) {
  const ids = {};
  edges.forEach((edge) => {
    ids[edge.a] = true;
    ids[edge.b] = true;
  });
  const seen = {};
  const found = [];
  Object.keys(ids).forEach((start) => {
    if (seen[start]) return;
    const members = [];
    const queue = [start];
    seen[start] = true;
    while (queue.length) {
      const id = queue.pop();
      members.push(id);
      edges.forEach((edge) => {
        const other = edge.a === id ? edge.b : edge.b === id ? edge.a : null;
        if (other && !seen[other]) {
          seen[other] = true;
          queue.push(other);
        }
      });
    }
    const member = {};
    members.forEach((id) => { member[id] = true; });
    const local = edges.filter((edge) => member[edge.a] && member[edge.b]);
    if (local.length >= members.length) found.push({ members: members, edges: local });
  });
  return found;
}

function zeroRows(n) {
  const rows = [];
  for (let row = 0; row < n; row++) {
    const line = [];
    for (let col = 0; col < n; col++) line.push(0);
    rows.push(line);
  }
  return rows;
}

function solveLinear(matrix, vector) {
  const n = vector.length;
  const a = matrix.map((row, index) => row.concat([vector[index]]));
  for (let col = 0; col < n; col++) {
    let pivot = col;
    for (let row = col + 1; row < n; row++) {
      if (Math.abs(a[row][col]) > Math.abs(a[pivot][col])) pivot = row;
    }
    if (Math.abs(a[pivot][col]) < 1e-12) return null;
    const swap = a[col];
    a[col] = a[pivot];
    a[pivot] = swap;
    const div = a[col][col];
    for (let k = col; k <= n; k++) a[col][k] /= div;
    for (let row = 0; row < n; row++) {
      if (row === col) continue;
      const factor = a[row][col];
      for (let k = col; k <= n; k++) a[row][k] -= factor * a[col][k];
    }
  }
  return a.map((row) => row[n]);
}

function edgeResidual(edge, ruler, at, n) {
  const left = at[edge.a] || anchors[edge.a];
  const right = at[edge.b] || anchors[edge.b];
  let dist = rawDistance(left, right);
  let ref = rawDistance(anchors[ruler.a], anchors[ruler.b]);
  if (dist < 0.02) dist = 0.02;
  if (ref < 0.02) ref = 0.02;
  return (edge.rssi - ruler.rssi) + 10 * n * Math.log10(dist / ref);
}

// Pin the loudest edge and move the other nodes so each remaining edge matches
// d / d_ruler = 10^((rssi_ruler - rssi) / (10·n)). n is searched, not taken from the sketch.
function relaxRanges(free, edges, ruler, n) {
  const index = {};
  free.forEach((id, i) => { index[id] = i; });
  const dim = free.length * 2;
  if (!dim) return null;
  const x = [];
  free.forEach((id) => {
    const p = proportion(anchors[id]);
    x.push(p.x, p.y);
  });
  const pin = {};
  pin[ruler.a] = proportion(anchors[ruler.a]);
  pin[ruler.b] = proportion(anchors[ruler.b]);
  let dRef = Math.hypot(pin[ruler.a].x - pin[ruler.b].x, pin[ruler.a].y - pin[ruler.b].y);
  if (dRef < 0.02) dRef = 0.02;
  const scale = (10 * n) / LN10;
  function coord(id) {
    if (pin[id]) return pin[id];
    const i = index[id];
    return { x: x[2 * i], y: x[2 * i + 1] };
  }
  for (let iter = 0; iter < 8; iter++) {
    const matrix = zeroRows(dim);
    const vector = [];
    for (let i = 0; i < dim; i++) vector.push(0);
    edges.forEach((edge) => {
      if (edge === ruler) return;
      const p = coord(edge.a);
      const q = coord(edge.b);
      const dx = p.x - q.x;
      const dy = p.y - q.y;
      let dist = Math.hypot(dx, dy);
      if (dist < 0.02) dist = 0.02;
      const residual = (edge.rssi - ruler.rssi) + 10 * n * Math.log10(dist / dRef);
      const jx = scale * dx / (dist * dist);
      const jy = scale * dy / (dist * dist);
      const cols = [];
      if (index[edge.a] !== undefined) {
        cols.push([2 * index[edge.a], jx]);
        cols.push([2 * index[edge.a] + 1, jy]);
      }
      if (index[edge.b] !== undefined) {
        cols.push([2 * index[edge.b], -jx]);
        cols.push([2 * index[edge.b] + 1, -jy]);
      }
      cols.forEach((col) => {
        vector[col[0]] -= col[1] * residual;
        cols.forEach((other) => {
          matrix[col[0]][other[0]] += col[1] * other[1];
        });
      });
    });
    const delta = solveLinear(matrix, vector);
    if (!delta) return null;
    let step = 0;
    delta.forEach((value) => { step += value * value; });
    step = Math.sqrt(step);
    const cap = step > 0.5 ? 0.5 / step : 1;
    for (let i = 0; i < dim; i++) {
      x[i] += delta[i] * cap;
      if (!isFinite(x[i])) return null;
    }
  }
  const at = {};
  for (let i = 0; i < free.length; i++) {
    const stored = storedPoint({ x: x[2 * i], y: x[2 * i + 1] });
    if (!isFinite(stored.x) || !isFinite(stored.y)) return null;
    if (stored.x < -0.25 || stored.x > 1.25 || stored.y < -0.25 || stored.y > 1.25) return null;
    at[free[i]] = stored;
  }
  let abs = 0;
  let count = 0;
  edges.forEach((edge) => {
    if (edge === ruler) return;
    abs += Math.abs(edgeResidual(edge, ruler, at, n));
    count += 1;
  });
  if (!count) return null;
  return { at: at, mean: abs / count };
}

function solveComponent(members, edges) {
  let ruler = edges[0];
  edges.forEach((edge) => {
    if (edge.rssi > ruler.rssi) ruler = edge;
  });
  if (rawDistance(anchors[ruler.a], anchors[ruler.b]) < 0.02) return null;
  const free = members.filter((id) => id !== ruler.a && id !== ruler.b);
  if (!free.length) return null;
  let best = null;
  for (let step = 15; step <= 45; step++) {
    const n = step / 10;
    const solved = relaxRanges(free, edges, ruler, n);
    if (!solved) continue;
    // A triangle fits every n, so a tie keeps the house default, 2.7.
    const closer = best && Math.abs(solved.mean - best.mean) <= 0.05 && Math.abs(n - 2.7) < Math.abs(best.n - 2.7);
    if (!best || solved.mean < best.mean - 0.05 || closer) {
      best = { at: solved.at, n: n, mean: solved.mean };
    }
  }
  if (!best) return null;
  if (edges.length >= 4) {
    let worst = null;
    edges.forEach((edge) => {
      if (edge === ruler) return;
      const db = Math.abs(edgeResidual(edge, ruler, best.at, best.n));
      if (!worst || db > worst.db) worst = { edge: edge, db: db };
    });
    if (worst && worst.db > OUTLIER_DB) {
      const rest = edges.filter((edge) => edge !== worst.edge);
      const again = relaxRanges(free, rest, ruler, best.n);
      if (again) return { at: again.at, n: best.n, edges: edges.length };
    }
  }
  return { at: best.at, n: best.n, edges: edges.length };
}

function placeNodes(ranges) {
  const parts = rangeComponents(rangeEdges(ranges));
  const fits = [];
  parts.forEach((part) => {
    const fit = solveComponent(part.members, part.edges);
    if (fit) fits.push(fit);
  });
  if (!fits.length) return null;
  fits.sort((left, right) => right.edges - left.edges);
  const at = {};
  fits.forEach((fit) => {
    Object.keys(fit.at).forEach((id) => { at[id] = fit.at[id]; });
  });
  return { at: at, n: fits[0].n };
}

function drawMap() {
  const nodes = payload && payload.nodes || [];
  ensureAnchors(nodes);
  const fit = placeNodes(payload && payload.ranges);
  const shown = {};
  nodes.forEach((node) => {
    shown[node.id] = (fit && fit.at[node.id]) || anchors[node.id];
  });
  if (drag && dragAt && anchors[drag]) shown[drag] = dragAt;
  places = shown;
  const pos = {};
  mapEl.replaceChildren();
  nodes.forEach((node) => {
    const place = places[node.id];
    pos[node.id] = { x: place.x * 1000, y: place.y * 640, label: node.label || node.id };
  });
  (payload.edges || []).forEach((edge) => {
    const from = pos[edge.from];
    const to = pos[edge.to];
    if (!from || !to) return;
    const path = svg("path");
    const midX = (from.x + to.x) / 2;
    const midY = (from.y + to.y) / 2 - 36;
    path.setAttribute("d", "M " + from.x + " " + from.y + " Q " + midX + " " + midY + " " + to.x + " " + to.y);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#e7d7b1");
    path.setAttribute("stroke-width", String(1 + Math.min(edge.count || 1, 8)));
    path.setAttribute("opacity", "0.9");
    mapEl.append(path);
  });
  nodes.forEach((node) => {
    const at = pos[node.id];
    const circle = svg("circle");
    circle.setAttribute("cx", String(at.x));
    circle.setAttribute("cy", String(at.y));
    circle.setAttribute("r", "26");
    circle.setAttribute("fill", colorFor(node.id));
    circle.setAttribute("data-node", node.id);
    circle.addEventListener("pointerdown", (event) => {
      drag = node.id;
      if (event.target.setPointerCapture && event.pointerId !== undefined) {
        event.target.setPointerCapture(event.pointerId);
      }
    });
    mapEl.append(circle);
    const text = svg("text");
    text.setAttribute("x", String(at.x));
    text.setAttribute("y", String(at.y + 46));
    text.setAttribute("text-anchor", "middle");
    text.textContent = node.label || node.id;
    mapEl.append(text);
  });
  const n = fit ? fit.n : exponent(nodes);
  shownTracks().forEach((track, index) => {
    const at = placeTrack(track, pos, n, index);
    if (!at) return;
    const dot = svg("circle");
    dot.setAttribute("cx", String(at.x));
    dot.setAttribute("cy", String(at.y));
    dot.setAttribute("r", track.class === "pass" ? "5" : "7");
    dot.setAttribute("fill", "#f4efe6");
    mapEl.append(dot);
    const label = svg("text");
    label.setAttribute("x", String(at.x + 12));
    label.setAttribute("y", String(at.y));
    label.textContent = track.label;
    mapEl.append(label);
  });
}

function onMove(event) {
  if (!drag) return;
  const rect = mapEl.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  dragAt = {
    x: clamp((event.clientX - rect.left) / rect.width),
    y: clamp((event.clientY - rect.top) / rect.height),
  };
  anchors[drag] = dragAt;
  drawMap();
}

function onUp() {
  if (!drag) return;
  drag = null;
  dragAt = null;
  const nodes = {};
  Object.keys(anchors).forEach((id) => {
    nodes[id] = { x: clamp(anchors[id].x), y: clamp(anchors[id].y) };
  });
  fetch("/api/traffic/layout", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nodes: nodes }),
  }).then((response) => {
    if (!response.ok) errorEl.textContent = "The layout was not saved.";
  }).catch(() => {
    errorEl.textContent = "The layout was not saved.";
  });
  drawMap();
}

function summarize() {
  const tracks = payload.tracks || [];
  let staying = 0;
  let moving = 0;
  let passed = 0;
  tracks.forEach((track) => {
    if (track.class === "move") moving += 1;
    else if (track.class === "pass") passed += 1;
    else staying += 1;
  });
  let text = staying + " staying, " + moving + " moving, " + passed + " passed by";
  if (payload.truncated) text += ". Showing the latest part of this window.";
  summaryEl.textContent = text;
  const folded = bandTracks();
  bandEl.textContent = folded.length ? folded.length + " passed by, folded into one band." : "";
}

function drawTimeline() {
  const groups = [];
  const items = [];
  let nextId = 1;
  shownTracks().forEach((track) => {
    groups.push({ id: track.id, content: escapeText(track.label) });
    (track.stays || []).forEach((stay) => {
      const end = stay.end <= stay.start ? stay.start + 1000 : stay.end;
      items.push({
        id: nextId,
        group: track.id,
        start: new Date(stay.start),
        end: new Date(end),
        content: escapeText(stay.node),
        style: "background:" + colorFor(stay.node) + ";color:#1c160f",
        type: "range",
      });
      nextId += 1;
    });
  });
  const folded = bandTracks();
  if (folded.length) {
    groups.push({ id: "band", content: "Passed by" });
    folded.forEach((track) => {
      (track.stays || []).forEach((stay) => {
        const end = stay.end <= stay.start ? stay.start + 1000 : stay.end;
        items.push({
          id: nextId,
          group: "band",
          start: new Date(stay.start),
          end: new Date(end),
          content: escapeText(track.label),
          style: "background:#6b6458;color:#f4efe6",
          type: "range",
        });
        nextId += 1;
      });
    });
  }
  if (typeof vis === "undefined" || !vis.Timeline || !vis.DataSet) {
    lanesEl.replaceChildren();
    groups.forEach((group) => {
      const row = document.createElement("p");
      row.textContent = group.content;
      lanesEl.append(row);
    });
    return;
  }
  if (!timeline) {
    itemSet = new vis.DataSet(items);
    groupSet = new vis.DataSet(groups);
    timeline = new vis.Timeline(lanesEl, itemSet, groupSet, {
      stack: true,
      orientation: "top",
      zoomable: true,
      selectable: false,
      showCurrentTime: true,
    });
    timeline.addCustomTime(new Date(scrub), "scrub");
    timeline.on("timechange", (props) => {
      if (!props || props.id !== "scrub" || !props.time) return;
      scrub = props.time.getTime();
      const latest = payload && typeof payload.to === "number" ? payload.to : scrub;
      following = latest - scrub <= 5000;
      drawMap();
    });
    return;
  }
  groupSet.clear();
  groupSet.add(groups);
  itemSet.clear();
  itemSet.add(items);
}

function render() {
  if (!payload) return;
  if (scrub === null) scrub = payload.to;
  summarize();
  const tracks = payload.tracks || [];
  const nodes = payload.nodes || [];
  emptyEl.hidden = tracks.length !== 0 || nodes.length !== 0;
  drawMap();
  drawTimeline();
}

function load() {
  fetch("/api/traffic?window=" + windowName).then((response) => {
    if (!response.ok) throw new Error("status");
    return response.json();
  }).then((body) => {
    payload = body;
    if (following || scrub === null) {
      scrub = body.to;
      if (timeline) timeline.setCustomTime(new Date(scrub), "scrub");
    }
    errorEl.textContent = "";
    render();
  }).catch(() => {
    errorEl.textContent = "The traffic log could not be read.";
  });
}

document.getElementById("win-live").addEventListener("click", () => { windowName = "live"; following = true; load(); });
document.getElementById("win-hour").addEventListener("click", () => { windowName = "hour"; following = true; load(); });
document.getElementById("win-day").addEventListener("click", () => { windowName = "day"; following = true; load(); });
passesEl.addEventListener("change", render);
document.getElementById("clear").addEventListener("click", () => {
  if (!confirm("Delete the traffic log on this machine?")) return;
  fetch("/api/traffic/clear", { method: "POST" }).then((response) => {
    if (!response.ok) {
      errorEl.textContent = "The log was not cleared.";
      return;
    }
    load();
  }).catch(() => {
    errorEl.textContent = "The log was not cleared.";
  });
});
mapEl.addEventListener("pointermove", onMove);
mapEl.addEventListener("pointerup", onUp);
mapEl.addEventListener("pointercancel", onUp);
load();
setInterval(() => { if (windowName === "live") load(); }, REFRESH_MS);
</script>
</body>
</html>
