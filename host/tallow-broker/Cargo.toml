[package]
name = "tallow-broker"
version = "0.1.0"
edition = "2021"
publish = false
description = "Vsock broker for the H7020 agent socket. Rust port of tools/panel_broker.py"

[dependencies]
anyhow = "1"
serde_json = "1.0.154"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }
tokio-vsock = "0.7"
