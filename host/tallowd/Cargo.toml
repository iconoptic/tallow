[package]
name = "tallowd"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aes = "0.8"
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4", features = ["clock"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
futures-util = { version = "0.3", default-features = false }
serde_urlencoded = "0.7"
serialport = { version = "4.10.1", default-features = false }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tallow-govee = { path = "../tallow-govee", features = ["ble"] }
tallow-mesh-core = { path = "../../firmware/mesh/core" }

[dev-dependencies]
ed25519-compact = { version = "2", default-features = false, features = ["opt_size"] }
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
