[package]
name = "tallow-govee"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pure codec for the Govee H7020 string lights: packet bytes in, reply bytes out"

[dependencies]
serde_json = "1.0.154"

[features]
# The Bluetooth transport contract. Off by default, so the codec builds with no
# Bluetooth code. tallowd turns it on for the BlueZ link.
default = []
ble = []
