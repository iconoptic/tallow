# The cam skew: an OV3660 on the MB0200 pins, served as MJPEG on :8080.
# The panel proxies the stream. A cam sends frames only while someone watches.
# Nothing is recorded here or on the host.

i2c:
  - id: cam_sccb
    sda: GPIO4
    scl: GPIO5

esp32_camera:
  name: ${node_name} cam
  i2c_id: cam_sccb
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  # Y2..Y9
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13
  resolution: 800x600
  jpeg_quality: 12
  max_framerate: 10 fps
  idle_framerate: 0.1 fps

esp32_camera_web_server:
  - port: 8080
    mode: stream

# Video and BLE share one radio. A cam still forwards advertisements, but GATT
# connections belong to dedicated nodes, not to a cam.
bluetooth_proxy:
  active: false
