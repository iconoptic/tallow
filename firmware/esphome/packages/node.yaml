# A tallow node. Every tallow ESP32 pulls this in, whatever else it does.
# A node hears Bluetooth near it and hands it to the host over tallow-iot.
# Each node talks only to the host. The host picks the best node for each
# device, so more nodes means more of the house is in Bluetooth range.
#
# vars: node_name, node_address (10.87.0.20-49, outside the AP's DHCP range)

esphome:
  name: ${node_name}

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # tallow-iot hands out no mDNS and no route. The host dials this address.
  manual_ip:
    static_ip: ${node_address}
    gateway: 10.87.0.1
    subnet: 255.255.255.0
    dns1: 10.87.0.1
  use_address: ${node_address}
  # No fallback AP. An open join is how a node ends up on someone else's network.

api:
  encryption:
    key: !secret api_key
  # Nothing on the host holds the API open yet. Do not reboot for the lack of it.
  reboot_timeout: 0s

# Uploads use the API key; an uploader without it is refused.
ota:
  - platform: esphome
    encryption: {}

time:
  - platform: sntp
    servers:
      - 10.87.0.1

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

# Where a node can live is set by its signal to the AP. node_check prints it.
sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
