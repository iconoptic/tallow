# Toby's second cam, the same board as toby-cam-1. Counting starts at 0 from here on.
#   ESPHOME_DEVICE=/dev/ttyACM0 tools/esphome.sh mac            hold BOOT, tap RST first
#   sudo ./tools/setup_iot_ap.sh allow <mac>
#   ESPHOME_DEVICE=/dev/ttyACM0 tools/esphome.sh run toby-cam-0.yaml --device /dev/ttyACM0

packages:
  board: !include packages/board-mb0200.yaml
  node: !include
    file: packages/node.yaml
    vars:
      node_name: toby-cam-0
      node_address: 10.87.0.23
  dogcam: !include
    file: packages/dogcam.yaml
    vars:
      node_name: toby-cam-0
