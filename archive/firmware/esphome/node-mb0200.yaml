# A bare node on an MB0200. Proves the base before any skew.
#   tools/esphome.sh run node-mb0200.yaml
#   .venv/bin/python tools/node_check.py --address 10.87.0.20

packages:
  board: !include packages/board-mb0200.yaml
  node: !include
    file: packages/node.yaml
    vars:
      node_name: node-mb0200
      node_address: 10.87.0.20
